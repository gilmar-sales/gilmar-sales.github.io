---
layout: default
title: Arquivo
permalink: /archive/
---

<div class="archive">
    {% assign grouped = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
    {% for year in grouped %}
    <section class="archive-year">
        <h2 class="archive-year-heading">{{ year.name }}</h2>
        <div class="post-list">
            {% for post in year.items %}
                {% include post-card.html post=post %}
            {% endfor %}
        </div>
    </section>
    {% endfor %}
</div>
