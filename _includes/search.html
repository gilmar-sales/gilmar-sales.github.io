<div class="search-container" id="search-container" hidden>
    <div
        class="search-backdrop"
        id="search-backdrop"
        aria-hidden="true"
    ></div>
    <div
        class="search-panel"
        role="dialog"
        aria-modal="true"
        aria-label="Buscar posts"
    >
        <div class="search-bar">
            <i class="fas fa-search search-bar-icon" aria-hidden="true"></i>
            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="Buscar posts..."
                autocomplete="off"
                aria-controls="search-results"
            />
            <kbd class="search-kbd">esc</kbd>
            <button
                id="search-close"
                class="search-close"
                aria-label="Fechar busca"
                type="button"
            >
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="search-results" class="search-results" role="listbox"></div>
    </div>
</div>

<script>
    (function () {
        var searchContainer = document.getElementById("search-container");
        var searchInput = document.getElementById("search-input");
        var searchResults = document.getElementById("search-results");
        var searchClose = document.getElementById("search-close");
        var searchBackdrop = document.getElementById("search-backdrop");
        var searchData = null;
        var isOpen = false;

        function loadSearchData() {
            if (searchData) return Promise.resolve(searchData);
            return fetch("/search.json")
                .then(function (response) {
                    if (!response.ok) throw new Error("Search data not found");
                    return response.json();
                })
                .then(function (data) {
                    searchData = data;
                    return data;
                })
                .catch(function (error) {
                    console.log(error);
                    searchData = [];
                    return [];
                });
        }

        function normalizeText(text) {
            return String(text || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");
        }

        function search(query) {
            if (!searchData || !query.trim()) {
                searchResults.innerHTML = "";
                return;
            }

            var normalizedQuery = normalizeText(query);
            var results = searchData.filter(function (item) {
                var titleMatch = normalizeText(item.title).includes(
                    normalizedQuery,
                );
                var contentMatch = normalizeText(item.content).includes(
                    normalizedQuery,
                );
                var categoryMatch =
                    item.categories &&
                    item.categories.some(function (cat) {
                        return normalizeText(cat).includes(normalizedQuery);
                    });
                return titleMatch || contentMatch || categoryMatch;
            });

            displayResults(results);
        }

        function displayResults(results) {
            if (results.length === 0) {
                searchResults.innerHTML =
                    '<div class="search-no-results">Nenhum resultado encontrado</div>';
                return;
            }

            var html = '<ul class="search-results-list">';
            results.forEach(function (item) {
                html += '<li class="search-result-item">';
                html +=
                    '<a href="' +
                    item.url +
                    '" class="search-result-link" role="option">';
                html +=
                    '<span class="search-result-title">' +
                    item.title +
                    "</span>";
                if (item.excerpt) {
                    html +=
                        '<span class="search-result-excerpt">' +
                        item.excerpt +
                        "</span>";
                }
                if (item.categories && item.categories.length > 0) {
                    html +=
                        '<span class="search-result-categories">' +
                        item.categories.join(", ") +
                        "</span>";
                }
                html += "</a></li>";
            });
            html += "</ul>";
            searchResults.innerHTML = html;
        }

        function toggleSearch(show) {
            isOpen = show;
            if (show) {
                searchContainer.hidden = false;
                searchContainer.classList.add("active");
                document.body.style.overflow = "hidden";
                searchInput.focus();
                loadSearchData();
            } else {
                searchContainer.classList.remove("active");
                searchContainer.hidden = true;
                document.body.style.overflow = "";
                searchInput.value = "";
                searchResults.innerHTML = "";
            }
        }

        searchInput.addEventListener("input", function (e) {
            search(e.target.value);
        });

        searchClose.addEventListener("click", function () {
            toggleSearch(false);
        });

        searchBackdrop.addEventListener("click", function () {
            toggleSearch(false);
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && isOpen) {
                toggleSearch(false);
            }
        });

        window.openSearch = function () {
            toggleSearch(true);
        };

        var searchToggle = document.getElementById("search-toggle");
        if (searchToggle) {
            searchToggle.addEventListener("click", function (event) {
                event.preventDefault();
                toggleSearch(true);
            });
        }

        document.addEventListener("keydown", function (e) {
            if ((e.ctrlKey || e.metaKey) && e.key === "k") {
                e.preventDefault();
                toggleSearch(!isOpen);
            }
        });
    })();
</script>
