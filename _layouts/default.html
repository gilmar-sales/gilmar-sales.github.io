<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>{{ page.title }}</title>
        <!-- Anti-flash: apply saved theme before any rendering -->
        <script>
            (function () {
                var saved = localStorage.getItem("gs-theme");
                var sys = window.matchMedia("(prefers-color-scheme: dark)")
                    .matches
                    ? "dark"
                    : "light";
                document.documentElement.setAttribute(
                    "data-theme",
                    saved || sys,
                );
                document.documentElement.classList.add("no-transition");
                window.addEventListener("load", function () {
                    document.documentElement.classList.remove("no-transition");
                });
            })();
        </script>
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <!-- CSS -->
        <link rel="stylesheet" href="{{ site.baseurl }}/css/base.css" />
        <link rel="stylesheet" href="{{ site.baseurl }}/css/tables.css" />
        <link
            rel="stylesheet"
            href="{{ site.baseurl }}/css/highlight-dark.css"
        />
        <link rel="stylesheet" href="{{ site.baseurl }}/css/tokens.css" />
        <link rel="stylesheet" href="{{ site.baseurl }}/css/mobile.css" />
        <link rel="stylesheet" href="{{ site.baseurl }}/css/screens.css" />
        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
            integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <!-- MathJax -->
        <script
            id="MathJax-script"
            async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
        ></script>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
        />
    </head>
    <body class="grid paper">
        <nav class="nav">
            <div style="display: flex; align-items: center; gap: 16px;">
                <a href="/" class="nav-brand">gs</a>
                <div class="nav-name">gilmar-sales</div>
            </div>
            <nav>
                <a href="/" {% if page.url == "/" %}class="active"{% endif %}>início</a>
                <a href="/archive/" {% if page.url == "/archive/" %}class="active"{% endif %}>arquivo</a>
                <a href="/topics/" {% if page.url == "/topics/" or page.url contains "/topics/" %}class="active"{% endif %}>tópicos</a>
                <a href="/projects/" {% if page.url contains "/projects" %}class="active"{% endif %}>projetos</a>
                <a href="/tools/" {% if page.url contains "/tools" %}class="active"{% endif %}>ferramentas</a>
            </nav>
            <div class="tools">
                <!--<button class="lang-pill" id="lang-toggle">
                    <b>PT</b> <span style="opacity: .5">/</span> EN
                </button>-->
                <button
                    class="icon-btn tip-btn"
                    id="search-toggle"
                    type="button"
                    aria-label="Buscar"
                    aria-keyshortcuts="Control+K Meta+K"
                >
                    <i class="fas fa-search" aria-hidden="true"></i>
                    <span class="tip" role="tooltip">
                        Buscar
                        <span class="tip-keys" data-keys="mod+k"></span>
                    </span>
                </button>
                <button
                    class="icon-btn tip-btn"
                    id="theme-toggle"
                    type="button"
                    aria-label="Alternar tema"
                    aria-keyshortcuts="Control+Shift+L Meta+Shift+L"
                >
                    <i id="theme-icon" class="fas fa-moon" aria-hidden="true"></i>
                    <span class="tip" role="tooltip">
                        Alternar tema
                        <span class="tip-keys" data-keys="mod+shift+l"></span>
                    </span>
                </button>
            </div>
            <div
                class="nav-progress-bar"
                id="nav-progress-bar"
            ></div>
        </nav>
        <div class="container scroll">
            <div class="content ">{{ content }}</div>
            {% include search.html %}
        </div>
        <script>
            (function () {
                var html = document.documentElement;
                var btn = document.getElementById("theme-toggle");
                var icon = document.getElementById("theme-icon");
                var searchBtn = document.getElementById("search-toggle");
                var isMac =
                    /Mac|iPhone|iPad|iPod/.test(navigator.platform) ||
                    (navigator.userAgentData &&
                        navigator.userAgentData.platform === "macOS");

                function formatKeys(spec) {
                    return spec.split("+").map(function (part) {
                        if (part === "mod") return isMac ? "⌘" : "Ctrl";
                        if (part === "shift") return isMac ? "⇧" : "Shift";
                        if (part === "alt") return isMac ? "⌥" : "Alt";
                        return part.toUpperCase();
                    });
                }

                function renderTipKeys() {
                    document
                        .querySelectorAll(".tip-keys[data-keys]")
                        .forEach(function (el) {
                            var keys = formatKeys(el.getAttribute("data-keys"));
                            el.innerHTML = keys
                                .map(function (k) {
                                    return "<kbd>" + k + "</kbd>";
                                })
                                .join("");
                        });

                    if (searchBtn) {
                        var searchLabel =
                            "Buscar (" +
                            formatKeys("mod+k").join(isMac ? "" : "+") +
                            ")";
                        searchBtn.setAttribute("aria-label", searchLabel);
                    }
                    if (btn) {
                        var themeLabel =
                            "Alternar tema (" +
                            formatKeys("mod+shift+l").join(isMac ? "" : "+") +
                            ")";
                        btn.setAttribute("aria-label", themeLabel);
                    }
                }

                function updateIcon() {
                    icon.className =
                        html.getAttribute("data-theme") === "dark"
                            ? "fas fa-sun"
                            : "fas fa-moon";
                }

                function toggleTheme() {
                    var next =
                        html.getAttribute("data-theme") === "dark"
                            ? "light"
                            : "dark";
                    html.setAttribute("data-theme", next);
                    localStorage.setItem("gs-theme", next);
                    updateIcon();
                }

                function isTypingTarget(el) {
                    if (!el) return false;
                    var tag = el.tagName;
                    return (
                        tag === "INPUT" ||
                        tag === "TEXTAREA" ||
                        tag === "SELECT" ||
                        el.isContentEditable
                    );
                }

                renderTipKeys();
                updateIcon();

                btn.addEventListener("click", function () {
                    toggleTheme();
                });

                document.addEventListener("keydown", function (e) {
                    if (!(e.ctrlKey || e.metaKey) || !e.shiftKey) return;
                    if (e.key.toLowerCase() !== "l") return;
                    if (isTypingTarget(e.target)) return;
                    e.preventDefault();
                    toggleTheme();
                });

                // Language toggle (placeholder for future i18n)
                var langBtn = document.getElementById("lang-toggle");
                langBtn?.addEventListener("click", function () {
                    // Future: switch between PT/EN content
                });
            })();
        </script>
    </body>
</html>
